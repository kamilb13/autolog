name: autolog
description: "AutoLog - Dziennik Serwisowy i Kosztów Pojazdów (100% Flutter)"
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  path_provider: ^2.1.5
  path: ^1.9.0
  intl: ^0.20.3
  uuid: ^4.5.1
  fl_chart: ^0.70.2
  share_plus: ^10.1.3
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  http: ^1.3.0
  pdf: ^3.11.1
  printing: ^5.13.2
  file_picker: ^11.0.3
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/LiberationSans-Regular.ttf
    - assets/fonts/LiberationSans-Bold.ttf
    - assets/fonts/LICENSE.txt
